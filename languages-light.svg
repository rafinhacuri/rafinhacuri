    <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0891B2"/><stop offset=".5" stop-color="#4F46E5"/><stop offset="1" stop-color="#9333EA"/>
  </linearGradient>
  <clipPath id="bar"><rect x="32" y="62" width="776" height="12" rx="6">
