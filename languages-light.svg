<svg xmlns="http://www.w3.org/2000/svg" width="840" height="178" viewBox="0 0 840 178" fill="none" role="img" aria-labelledby="t d">
<title id="t">rafinhacuri&#39;s most used languages</title>
<desc id="d">TypeScript 47.5%, Vue 43.3%, Go 6.5%, CSS 1.7%, Other 1.0%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; fill: #59636E; }
  .muted { fill: #59636E; }
  .rise { animation: rise .7s cubic-bezier(.22,1,.36,1) both; }
  .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
